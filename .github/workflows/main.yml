name: Build NixOS Image for ARM

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-arm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies for ARM emulation
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support

    - name: Install Nix package manager
      run: |
        curl -L https://nixos.org/nix/install | sh
        . /home/runner/.nix-profile/etc/profile.d/nix.sh

    - name: Build NixOS ARM Image
      env:
        NIX_PATH: nixpkgs=channel:nixos-unstable
      run: |
        nix-build examples/installer/ --argstr device lenovo-wormdingler -A outputs.default

    - name: Upload ARM Image
      uses: actions/upload-artifact@v3
      with:
        name: nixos-arm-image
        path: ./result
