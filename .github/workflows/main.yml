name: Build strongbad ARM rootfs

on:
  # Manual trigger
  workflow_dispatch:
  
  # Trigger on push to the 'development' branch
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository (for your script and any related files)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Clone the shimboot repo
      - name: Clone shimboot repository
        run: |
          sudo apt install nix
          git clone https://github.com/mobile-nixos/mobile-nixos.git
          cd nixos-mobile
          nix-build examples/installer --argstr device lenovo-wormdingler -A outputs.default


      # Step 5: Upload the output as an artifact
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: strongbad-rootfs
          path: result/  # Adjust based on where the output files are generated
