name: Build pmbootstrap Image

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt update && sudo apt install -y pmbootstrap

      - name: Initialize pmbootstrap
        run: |
          pmbootstrap config device lenovo-duet3
          pmbootstrap config ui lomiri
          pmbootstrap init --no-interactive

      - name: Build and package image
        run: |
          pmbootstrap install
          pmbootstrap export

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-image
          path: ~/.local/var/pmbootstrap/chroot_rootfs_export/*
