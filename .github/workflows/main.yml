name: Build pmbootstrap Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt update && sudo apt install -y python3 git wget curl lz4 cpio
          git clone https://gitlab.com/postmarketOS/pmbootstrap.git ~/pmbootstrap
          chmod +x ~/pmbootstrap/pmbootstrap

      - name: Initialize pmbootstrap
        run: |
          export PATH=$HOME/pmbootstrap:$PATH
          ~/pmbootstrap/pmbootstrap init --work-dir ~/pmbootstrap_work --arch aarch64 --device lenovo-duet3
          ~/pmbootstrap/pmbootstrap config ui lomiri

      - name: Build and package image
        run: |
          export PATH=$HOME/pmbootstrap:$PATH
          ~/pmbootstrap/pmbootstrap install
          ~/pmbootstrap/pmbootstrap export

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-image
          path: ~/pmbootstrap_work/chroot_rootfs_export/*
